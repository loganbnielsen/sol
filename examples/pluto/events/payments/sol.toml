# Sol event contract. This declaration is canonical; `sol contract generate`
# writes the binding from it and CI fails when the two drift.

[contract]
language = "ocaml"

[[events]]
name = "Charged"
topic = "pluto-payments-charges"
partitions = 3
key = "id"
schema = '''{
  "type": "object",
  "properties": {
    "id":             { "type": "string"  },
    "amount_cents":   { "type": "integer" },
    "customer_id":    { "type": "string"  },
    "currency":       { "type": "string"  },
    "correlation_id": { "type": "string"  }
  },
  "required": ["id", "amount_cents", "customer_id", "currency", "correlation_id"]
}'''
