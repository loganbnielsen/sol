# The "Pluto orders" scenario's TypeScript binding scope (FEAT-131).
#
# This scope is a *projection* of the scenario's canonical event contract in
# events/orders/sol.toml. It carries its own namespace topics (the TypeScript
# deployment runs beside the OCaml one), and it may carry nothing else of its
# own: CI requires every event here to reproduce the canonical name, schema,
# partitions and key, and to add no event of its own.
# `sol contract generate` writes the TypeScript binding into the scope's contract
# package and CI fails when the two drift.

[contract]
language = "typescript"

[[events]]
name = "OrderPlaced"
topic = "sol-demo-ts-orders"
partitions = 3
key = "order_id"
schema = '''{
  "type": "object",
  "properties": {
    "order_id":       { "type": "string"  },
    "item":           { "type": "string"  },
    "quantity":       { "type": "integer" },
    "correlation_id": { "type": "string"  }
  },
  "required": ["order_id", "item", "quantity", "correlation_id"]
}'''

[[events]]
name = "OrderFulfilled"
topic = "sol-demo-ts-fulfilled"
partitions = 3
key = "order_id"
schema = '''{
  "type": "object",
  "properties": {
    "order_id":       { "type": "string"  },
    "item":           { "type": "string"  },
    "quantity":       { "type": "integer" },
    "correlation_id": { "type": "string"  }
  },
  "required": ["order_id", "item", "quantity", "correlation_id"]
}'''
