# TypeScript projection of `events/orders/sol.toml`; keep event schemas and keys
# aligned while retaining this deployment's own topic names.

[contract]
language = "typescript"

[[events]]
name = "OrderPlaced"
topic = "sol-demo-ts-orders"
partitions = 3
key = "order_id"
schema = '''{
  "type": "object",
  "properties": {
    "order_id":       { "type": "string"  },
    "item":           { "type": "string"  },
    "quantity":       { "type": "integer" },
    "correlation_id": { "type": "string"  }
  },
  "required": ["order_id", "item", "quantity", "correlation_id"]
}'''

[[events]]
name = "OrderFulfilled"
topic = "sol-demo-ts-fulfilled"
partitions = 3
key = "order_id"
schema = '''{
  "type": "object",
  "properties": {
    "order_id":       { "type": "string"  },
    "item":           { "type": "string"  },
    "quantity":       { "type": "integer" },
    "correlation_id": { "type": "string"  }
  },
  "required": ["order_id", "item", "quantity", "correlation_id"]
}'''
