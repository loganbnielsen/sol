# Canonical event contract for the Pluto orders scenario. Generate the OCaml
# binding from this file; the TypeScript projection must match its schemas and keys.

[contract]
language = "ocaml"

[[events]]
name = "OrderPlaced"
topic = "orders.v1"
partitions = 3
key = "order_id"
schema = '''{
  "type": "object",
  "properties": {
    "order_id":       { "type": "string"  },
    "item":           { "type": "string"  },
    "quantity":       { "type": "integer" },
    "correlation_id": { "type": "string"  }
  },
  "required": ["order_id", "item", "quantity", "correlation_id"]
}'''

[[events]]
name = "OrderFulfilled"
topic = "orders-fulfilled.v1"
partitions = 3
key = "order_id"
schema = '''{
  "type": "object",
  "properties": {
    "order_id":       { "type": "string"  },
    "item":           { "type": "string"  },
    "quantity":       { "type": "integer" },
    "correlation_id": { "type": "string"  }
  },
  "required": ["order_id", "item", "quantity", "correlation_id"]
}'''
