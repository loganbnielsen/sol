# Sol event contract. This declaration is canonical: `sol contract generate`
# writes {{team}}_contract.ml from it, and CI fails when the two drift.

[[events]]
name = "{{Mod}}"
topic = "{{team}}-{{name}}s"
partitions = 3
key = "id"
schema = '''{
  "type": "object",
  "properties": {
    "id":      { "type": "string" },
    "payload": { "type": "string" }
  },
  "required": ["id", "payload"]
}'''
