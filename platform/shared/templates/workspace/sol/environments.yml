# Each environment sets policy once, and
# This is a placeholder: rename the environment and target to your real ones,
# and set the SOL_TARGET repository variable in GitHub (used by
# .github/workflows/sol-ci.yml) to match.
#
# Account-specific values can go in ignored `sol/environments.local.yml`.
prod:
  targets:
    aws/us-east-1:
      # registry: <your-registry-url>
      secrets:
        payments/charge_svc:
          POSTGRES_URL: sol
          SOL_API_KEY: sol
        comms/notify_worker:
          POSTGRES_URL: sol
          SOL_API_KEY: sol
