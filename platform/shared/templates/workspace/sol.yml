# Sol workspace manifest.
#
# A directory containing this file is a Sol workspace. `sol` finds the
# workspace root by walking up from the current directory to the nearest
# sol.yml, so commands work from anywhere inside the workspace.
#
# Workspace-level configuration (project, resources, services) belongs here.
# The file is valid with no settings at all -- its presence is what
# establishes the boundary.

# The resources this workspace's services use. `sol local infra up` starts what is
# declared here (Postgres, Kafka), and a cloud target provisions it.
resources:
  app_db:
    type: postgres
  events:
    type: kafka

# FEAT-104: every workload declares its language, and nothing infers it. The two
# units this template ships, and any unit `sol new` adds, are recorded here; a
# command that needs the language (the local dev loop) refuses a workload that
# has not declared one rather than guessing.
services:
  charge_svc:
    language: ocaml
  notify_worker:
    language: ocaml
