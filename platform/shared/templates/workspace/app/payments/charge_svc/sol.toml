# Sol service configuration — all fields are optional.

[infra.scale]
# replicas = 1
# cpu      = "250m"
# memory   = "256Mi"

[infra.env]
# Runtime secrets are delivered to the running pod through <service>-secrets.
# Build-time secrets are only *named* for whatever builds this image (a hosted
# builder, or CI); Sol exports the names in the deployment plan and never
# delivers the values to the workload.
# secrets       = []
# build_secrets = ["BUILD_REGISTRY_TOKEN"]
# config        = {}

[infra.rollout]
# strategy = "canary"       # or "blue-green"
# steps    = [10, 40, 100]  # canary only
