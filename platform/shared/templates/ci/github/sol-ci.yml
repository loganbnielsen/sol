# Sol CI — build, test and deploy this workspace on every push to main.
#
# Authentication is GitHub OIDC: no long-lived cloud credentials are stored in
# this repository. Before the deploy job can run, configure the provider-side
# trust (docs/deployment/ci.md) and set these repository variables
# (Settings -> Secrets and variables -> Actions -> Variables):
#
#   SOL_TARGET                  <env>/<provider>/<region>, e.g. prod/aws/us-east-1.
#                               It must be declared in sol/environments.yml.
#                               The workflow never infers a target from the
#                               branch or the event (DEC-016).
#   SOL_REGISTRY                image registry prefix, e.g.
#                                 123456789.dkr.ecr.us-east-1.amazonaws.com
#                                 us-central1-docker.pkg.dev/my-project/{{name}}
#   SOL_DEPLOY_ROLE_ARN         AWS: the deploy identity (the target's
#                               `deploy_role_arn`); assumed through OIDC.
#   SOL_DEPLOY_SERVICE_ACCOUNT  GCP: the deploy service account; impersonated
#                               through Workload Identity Federation.
#
# Workload secret values are never held here (FEAT-053). Seed them out of band
# with `sol secret set --target <env>/<provider>/<region> <KEY>`; the deploy
# verifies them and fails closed, naming any key that is missing.

name: Sol CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  SOL_TARGET: ${{ vars.SOL_TARGET }}
  SOL_REGISTRY: ${{ vars.SOL_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"
          opam-depext: false

      - name: Install system deps
        run: sudo apt-get install -y librdkafka-dev libpq-dev

      - name: Install opam deps
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: eval $(opam env) && dune build

      - name: Test
        run: eval $(opam env) && dune runtest

  build-images:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate (AWS OIDC)
        if: vars.SOL_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SOL_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.SOL_AWS_REGION }}

      - name: Authenticate (GCP Workload Identity)
        if: vars.SOL_DEPLOY_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.SOL_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SOL_DEPLOY_SERVICE_ACCOUNT }}

      - name: Build and push images
        run: |
          set -euo pipefail
          short_sha=${IMAGE_TAG::7}
          find app -name Dockerfile | while read -r dockerfile; do
            dir=$(dirname "$dockerfile")
            unit=$(basename "$dir" | tr '_' '-')
            image="${SOL_REGISTRY}/{{name}}/${unit}:${short_sha}"
            docker build --provenance=false --sbom=false -t "$image" -f "$dockerfile" .
            docker push "$image"
          done

  deploy:
    needs: build-images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"
          opam-depext: false

      - name: Install system deps
        run: sudo apt-get install -y librdkafka-dev libpq-dev

      - name: Install opam deps
        run: opam install . --deps-only -y

      - name: Build sol
        run: eval $(opam env) && dune build cli/bin/main.exe

      - name: Authenticate (AWS OIDC)
        if: vars.SOL_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SOL_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.SOL_AWS_REGION }}

      - name: Authenticate (GCP Workload Identity)
        if: vars.SOL_DEPLOY_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.SOL_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SOL_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy
        run: |
          set -euo pipefail
          eval $(opam env)
          _build/default/cli/bin/main.exe deploy "$SOL_TARGET" \
            --registry "$SOL_REGISTRY" \
            --image-tag "${IMAGE_TAG::7}"

      - name: Migrate
        run: |
          set -euo pipefail
          eval $(opam env)
          _build/default/cli/bin/main.exe migrate "$SOL_TARGET"
