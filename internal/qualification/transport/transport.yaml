apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sol-qualifier-transport
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sol-qualifier-transport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sol-qualifier-transport
subjects:
  - kind: Group
    name: sol:qualifiers
    apiGroup: rbac.authorization.k8s.io
