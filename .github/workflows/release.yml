# FEAT-101 / DEC-049: publish a Sol release -- binary, platform bundle and
# migration-runner image -- from one build, so every Sol-owned asset the release
# uses is version-aligned with it.
#
#   sol <version>
#   ├── bin/sol                       built with SOL_RELEASE_VERSION=<version>
#   ├── share/sol/<version>/platform  this commit's platform/ tree
#   ├── migration-runner-image        ghcr.io/<owner>/sol-migration-runner@sha256:...
#   │                                 the same binary, published once
#   └── SUPPORT_REFS                  this commit's support-refs.txt (BUG-059): the
#                                     exact support-library revisions it was built from
#
# A version is published once: the workflow refuses a tag whose runner image
# already exists, so nothing a released CLI names can move afterwards.
#
# Replaces the pre-DEC-049 workflow (v0.1.0-alpha.1..6), which shipped bin/sol
# with the framework/ source and no platform/ tree, plus a standalone binary.
# Neither survives: sol new stopped reading framework source at DEC-025, and a
# release binary without its bundle now refuses to run rather than guess.
name: Release

on:
  push:
    tags: ['v*']
  # The tag push is the normal path. workflow_dispatch is the recovery path: the
  # workflow definition comes from the default branch, so a publish that was
  # interrupted after the runner image was pushed can be completed without moving
  # the tag (BUG-204). The artifact is still built from the tag's tree below.
  workflow_dispatch:
    inputs:
      version:
        description: 'The release tag to publish or resume, e.g. v0.1.0-alpha.7'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      RUNNER_REPO: ghcr.io/${{ github.repository_owner }}/sol-migration-runner
    steps:
      # The tagged tree on both paths: the archive is built from the revision the
      # version names, never from the default branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version || github.ref_name }}
          fetch-depth: 0

      # A version is published once, and only from its own tag: this refuses a
      # branch, a version whose release already exists, and a checkout that is not
      # the tag's commit, before anything is built.
      - name: Require a tag and an unpublished version
        id: revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          revision="$(git rev-parse HEAD)"
          if ! git rev-parse --verify --quiet "refs/tags/$VERSION^{commit}" >/dev/null; then
            echo "::error::$VERSION is not a tag; refusing to publish a version that names a branch"
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/$VERSION^{commit}")" != "$revision" ]; then
            echo "::error::$VERSION does not point at the checked-out revision $revision"
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::$VERSION is already published, and a version is published once"
            exit 1
          fi
          echo "revision=$revision" >>"$GITHUB_OUTPUT"
          echo "publishing $VERSION from $revision"

      - name: Install system dependencies
        run: sudo apt-get install -y librdkafka-dev libpq-dev libpq5

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1

      - name: Pin extracted opam packages
        uses: ./.github/actions/pin-opam-packages

      - name: Install OCaml dependencies
        run: opam install . --deps-only -y

      - name: Prepare Sol framework packages (DEC-025)
        run: bash platform/local/scripts/prepare-framework-deps.sh

      - name: Development build (the smoke's control binary)
        run: |
          opam exec -- dune build cli/bin/main.exe
          cp _build/default/cli/bin/main.exe "$RUNNER_TEMP/sol-dev"

      - name: Release build
        run: |
          SOL_RELEASE_VERSION="$VERSION" opam exec -- dune build cli/bin/main.exe
          mkdir -p "$RUNNER_TEMP/runner"
          cp _build/default/cli/bin/main.exe "$RUNNER_TEMP/runner/sol"
          got="$("$RUNNER_TEMP/runner/sol" --version)"
          [ "$got" = "$VERSION" ] || { echo "::error::built binary reports $got, not $VERSION"; exit 1; }

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The runner image is published once and never overwritten: if the tag is
      # already in the registry this reuses its digest, so an interrupted publish
      # resumes instead of failing (BUG-204). The digest is what Sol consumes, and
      # it cannot move once pushed (SEC-011).
      - name: Publish the migration runner, once
        id: runner
        run: |
          if docker pull --quiet "$RUNNER_REPO:$VERSION" >/dev/null 2>&1; then
            echo "$RUNNER_REPO:$VERSION is already published; reusing its digest rather than overwriting it"
          else
            docker build -f internal/tooling/release/migration-runner.Dockerfile \
              -t "$RUNNER_REPO:$VERSION" "$RUNNER_TEMP/runner"
            docker push "$RUNNER_REPO:$VERSION"
          fi
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$RUNNER_REPO:$VERSION")"
          [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for the published runner ($digest)"; exit 1; }
          echo "image=$digest" >> "$GITHUB_OUTPUT"

      - name: Build the release archive
        id: bundle
        run: |
          archive="$(internal/tooling/scripts/build-release-bundle.sh \
            --version "$VERSION" \
            --runner-image "${{ steps.runner.outputs.image }}" \
            --binary "$RUNNER_TEMP/runner/sol" \
            --support-refs support-refs.txt \
            --out "$RUNNER_TEMP/dist" | tail -1)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Installed-release smoke
        run: |
          internal/ci/smoke_installed_release.sh \
            "${{ steps.bundle.outputs.archive }}" "$VERSION" \
            "${{ steps.runner.outputs.image }}" "$RUNNER_TEMP/sol-dev"

      # GitHub rejects a release body over 125000 characters, and the generated
      # changelog carries one entry per merged pull request since the previous
      # release, so its length is unbounded. The body keeps the first $limit
      # characters on a line boundary and points at the full compare range
      # (BUG-204).
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          limit=100000
          notes="$RUNNER_TEMP/generated-notes.md"
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$VERSION" --jq .body >"$notes" 2>/dev/null; then
            echo "::warning::could not generate the changelog; publishing the runner digest and the compare range only"
            : >"$notes"
          fi
          previous="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            compare="https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          else
            compare="https://github.com/$GITHUB_REPOSITORY/compare/$previous...$VERSION"
          fi
          if [ "$(wc -c <"$notes")" -gt "$limit" ]; then
            echo "::warning::the generated changelog is $(wc -c <"$notes") characters; keeping the first $limit at a line boundary"
            awk -v limit="$limit" -v compare="$compare" '
              BEGIN { used = 0; truncated = 0 }
              truncated { next }
              {
                if (used + length($0) + 1 > limit) {
                  printf "\nThis changelog is longer than a release body may be; the full range is at <%s>.\n", compare
                  truncated = 1
                  next
                }
                used += length($0) + 1
                print
              }' "$notes" >"$notes.bounded"
            mv "$notes.bounded" "$notes"
          fi
          {
            printf 'Sol %s, from `%s`.\n\n' "$VERSION" "${{ steps.revision.outputs.revision }}"
            printf 'Migration runner: `%s`\n\n' "${{ steps.runner.outputs.image }}"
            cat "$notes"
          } >"$RUNNER_TEMP/release-body.md"
          gh release create "$VERSION" "${{ steps.bundle.outputs.archive }}" \
            --title "Sol $VERSION" --notes-file "$RUNNER_TEMP/release-body.md"
