# FEAT-101 / DEC-049: publish a Sol release -- binary, platform bundle and
# migration-runner image -- from one build, so every Sol-owned asset the release
# uses is version-aligned with it.
#
#   sol <version>
#   ├── bin/sol                       built with SOL_RELEASE_VERSION=<version>
#   ├── share/sol/<version>/platform  this commit's platform/ tree
#   └── migration-runner-image        ghcr.io/<owner>/sol-migration-runner@sha256:...
#                                     the same binary, published once
#
# A version is published once: the workflow refuses a tag whose runner image
# already exists, so nothing a released CLI names can move afterwards.
#
# Replaces the pre-DEC-049 workflow (v0.1.0-alpha.1..6), which shipped bin/sol
# with the framework/ source and no platform/ tree, plus a standalone binary.
# Neither survives: sol new stopped reading framework source at DEC-025, and a
# release binary without its bundle now refuses to run rather than guess.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ github.ref_name }}
      RUNNER_REPO: ghcr.io/${{ github.repository_owner }}/sol-migration-runner
    steps:
      - uses: actions/checkout@v5

      # The support-library snapshot this release builds against, recorded in the
      # bundle (SUPPORT_REFS) so the release's dependency revisions are on record.
      - name: Resolve support-package commits
        id: support
        run: |
          refs="$(internal/ci/resolve-support-packages.sh)"
          printf '%s\n' "$refs" | tee "$RUNNER_TEMP/SUPPORT_REFS"
          {
            echo "refs<<SUPPORT_REFS"
            printf '%s\n' "$refs"
            echo "SUPPORT_REFS"
          } >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: sudo apt-get install -y librdkafka-dev libpq-dev libpq5

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1

      - name: Pin extracted opam packages
        uses: ./.github/actions/pin-opam-packages
        with:
          refs: ${{ steps.support.outputs.refs }}

      - name: Install OCaml dependencies
        run: opam install . --deps-only -y

      - name: Prepare Sol framework packages (DEC-025)
        run: bash platform/local/scripts/prepare-framework-deps.sh

      - name: Development build (the smoke's control binary)
        run: |
          opam exec -- dune build cli/bin/main.exe
          cp _build/default/cli/bin/main.exe "$RUNNER_TEMP/sol-dev"

      - name: Release build
        run: |
          SOL_RELEASE_VERSION="$VERSION" opam exec -- dune build cli/bin/main.exe
          mkdir -p "$RUNNER_TEMP/runner"
          cp _build/default/cli/bin/main.exe "$RUNNER_TEMP/runner/sol"
          got="$("$RUNNER_TEMP/runner/sol" --version)"
          [ "$got" = "$VERSION" ] || { echo "::error::built binary reports $got, not $VERSION"; exit 1; }

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish the migration runner, once
        id: runner
        run: |
          if docker manifest inspect "$RUNNER_REPO:$VERSION" >/dev/null 2>&1; then
            echo "::error::$RUNNER_REPO:$VERSION already exists; a release version is published once"
            exit 1
          fi
          docker build -f internal/tooling/release/migration-runner.Dockerfile \
            -t "$RUNNER_REPO:$VERSION" "$RUNNER_TEMP/runner"
          docker push "$RUNNER_REPO:$VERSION"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$RUNNER_REPO:$VERSION")"
          [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for the pushed runner ($digest)"; exit 1; }
          echo "image=$digest" >> "$GITHUB_OUTPUT"

      - name: Build the release archive
        id: bundle
        run: |
          archive="$(internal/tooling/scripts/build-release-bundle.sh \
            --version "$VERSION" \
            --runner-image "${{ steps.runner.outputs.image }}" \
            --binary "$RUNNER_TEMP/runner/sol" \
            --support-refs "$RUNNER_TEMP/SUPPORT_REFS" \
            --out "$RUNNER_TEMP/dist" | tail -1)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Installed-release smoke
        run: |
          internal/ci/smoke_installed_release.sh \
            "${{ steps.bundle.outputs.archive }}" "$VERSION" \
            "${{ steps.runner.outputs.image }}" "$RUNNER_TEMP/sol-dev"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" "${{ steps.bundle.outputs.archive }}" \
            --title "Sol $VERSION" --generate-notes \
            --notes "Migration runner: \`${{ steps.runner.outputs.image }}\`"
