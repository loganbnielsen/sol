name: DCO

# Enforces the Developer Certificate of Origin on every commit in a pull request.
# See CONTRIBUTING.md. Runs alongside CI rather than inside it so a missing
# sign-off is reported as its own check with its own message.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sign-off:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The full range between base and head is needed, not a shallow tip.
          fetch-depth: 0

      - name: Check every commit carries a Signed-off-by trailer
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            # Merge commits are not authored changes -- a merge made on the
            # branch has no sign-off to give. Skip them rather than fail the PR.
            if [ "$(git log -1 --format=%P "$sha" | wc -w)" -gt 1 ]; then
              continue
            fi
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit ${sha:0:9} is missing a Signed-off-by trailer: $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Every commit needs a sign-off. Fix the last one with:"
            echo "    git commit -s --amend"
            echo "or across a range with:"
            echo "    git rebase --signoff $base"
            echo "See CONTRIBUTING.md and https://developercertificate.org/"
            exit 1
          fi
          echo "all commits signed off"
