name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Classifies the diff ONCE for the whole run. Every job consumes this output;
  # none of them carries its own path list. The definition itself lives in
  # internal/ci/classify-changes.sh, shared with the local pre-commit hook, and
  # its semantics are pinned by internal/ci/test_classify_changes.sh.
  #
  # continue-on-error: classification must never be able to fail the workflow.
  # If this job dies, `kind` is empty, and every consumer's condition
  # (`!= "docs-only"`) is TRUE, so the full suite runs. Uncertainty costs
  # compute, never coverage.
  #
  # NOTE: `test` below is a REQUIRED check, so it must always run. That is why it
  # uses `needs: classify` together with `if: always()` and branches inside the
  # job, rather than a job-level condition. A job-level `if` on a required check
  # leaves the check unreported and the pull request stuck on "Expected —
  # Waiting for status to be reported", which is worse than the cost this is
  # here to remove. The same rule applies to any job that later becomes
  # required: never give a required check a path or classification condition.
  classify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The three-dot diff needs both endpoints in the object database.
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        run: |
          # Pushes to main are always full CI: post-merge verification is
          # authoritative, and only pull-request execution is optimised.
          kind="source"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            kind="$(internal/ci/classify-changes.sh --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" || echo source)"
          fi
          case "$kind" in
            docs-only|source) ;;
            *) kind="source" ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Classification for ${{ github.event_name }}: $kind"

  test:
    runs-on: ubuntu-22.04
    needs: classify
    # always(): a `needs` edge would otherwise SKIP this job whenever the
    # classify job fails, and a skipped required check blocks the PR forever.
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore exact-source ticket validator
        id: docs_tooling
        if: needs.classify.outputs.kind == 'docs-only'
        uses: actions/cache/restore@v4
        with:
          path: _build/default/internal/tooling/soldev/bin/main.exe
          key: soldev-validation-v1-${{ runner.os }}-${{ hashFiles('internal/tooling/soldev/**/*.ml', 'internal/tooling/soldev/**/*.mli', 'internal/tooling/soldev/**/dune', 'internal/tooling/sol_process/**/*.ml', 'internal/tooling/sol_process/**/*.mli', 'internal/tooling/sol_process/**/dune', 'dune-project', 'dune-workspace', '*.opam', 'support-refs.txt') }}

      - name: Validate pipeline tickets
        if: needs.classify.outputs.kind == 'docs-only' && steps.docs_tooling.outputs.cache-hit == 'true'
        run: _build/default/internal/tooling/soldev/bin/main.exe pipeline validate

      - name: Validate ticket transitions
        run: |
          git diff --name-status -M origin/main...HEAD -- internal/pipeline/tickets | bash internal/ci/check_ticket_transitions.sh

      - name: Install the CI guards' tooling
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/tooling/scripts/prepare-guard-tools.sh

      # The required check must be VISIBLY intentional when the suite is
      # skipped -- not a job that merely looks like every step failed to run.
      - name: Docs-only change -- full suite deliberately not run
        if: needs.classify.outputs.kind == 'docs-only' && steps.docs_tooling.outputs.cache-hit == 'true'
        run: |
          echo "::notice::Classification: docs-only -- every changed path is in the safe allowlist, so the product build and tests were not run."
          {
            echo "### Classification: docs-only"
            echo ""
            echo "The required \`test\` check is green because **every** changed path is in the"
            echo "safe allowlist (\`docs/**\`, \`internal/pipeline/tickets/**\`, \`*.md\` outside"
            echo "\`.github/**\`, \`internal/tooling/perf/perf_baseline.json\`)."
            echo ""
            echo "The product build, the test suites and the platform smoke jobs were deliberately not"
            echo "run. Only ticket validation, transition/move checks, specification signatures,"
            echo "classification controls, and account-artifact checks run. Classification"
            echo "semantics are pinned by"
            echo "\`internal/ci/test_classify_changes.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # An exact-source validator cache makes docs-only checks lightweight.
      # A cache miss or uncertain classification takes the full source path.
      - name: Install system dependencies
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: sudo apt-get install -y librdkafka-dev libpq-dev libpq5

      - name: Set up OCaml
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1

      - name: Cache opam download cache
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        # INFRA-008: setup-ocaml caches the switch (~/.opam) keyed on the
        # switch files, so a key change — or a cold cache on a new branch —
        # re-fetches every source. The download cache is content-addressed and
        # safe to share, and the broad restore-key lets a pull request reuse
        # the last cache for this OS even after the pin file changes. That is
        # what stops a brief non-GitHub tarball-host outage from failing a PR
        # that changed no dependencies.
        uses: actions/cache@v4
        with:
          path: ~/.opam/download-cache
          key: opam-download-${{ runner.os }}-${{ hashFiles('.github/actions/pin-opam-packages/action.yml', 'support-refs.txt', 'dune-project', 'sol.opam') }}
          restore-keys: |
            opam-download-${{ runner.os }}-

      - name: Pin extracted opam packages
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        uses: ./.github/actions/pin-opam-packages

      - name: Install OCaml dependencies
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        timeout-minutes: 20
        # INFRA-008: retry a transient upstream fetch failure before failing
        # the job, and name the unreachable host when the failure is permanent.
        run: |
          set -o pipefail
          log="$(mktemp)"
          for attempt in 1 2 3; do
            if opam install . --deps-only --with-test -y 2>&1 | tee "$log"; then
              exit 0
            fi
            echo "::warning::opam install failed (attempt ${attempt}/3); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          host="$(grep -oE 'Fetch_fail\("[^"]+' "$log" | tail -1 | sed -E 's/.*"//; s|^https?://||; s|/.*||' || true)"
          echo "::error::opam install failed after 3 attempts${host:+ — unreachable host: ${host}}"
          exit 1

      - name: Prepare Sol framework packages (DEC-025)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        timeout-minutes: 20
        # THE canonical bootstrap — the same script documented for developers, so
        # there is one definition of the Sol development switch rather than a pin
        # list copied per consumer.
        #
        # This is what makes the clean-environment test meaningful: the scaffold
        # compile guard below must resolve the framework through INSTALLED
        # packages. A green local suite does not prove that on its own, because a
        # developer's switch already has the framework pinned to their checkout.
        run: bash platform/local/scripts/prepare-framework-deps.sh

      - name: Build
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: opam exec -- dune build

      # The full path supplies every binary its guards require (BUG-064).
      - name: Tooling for the unconditional guards (BUG-064)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          opam install --deps-only --with-test -y ./sol.opam
          opam exec -- dune build \
            internal/tooling/soldev/bin/main.exe \
            cli/bin/main.exe \
            cli/test/print_providers.exe

      # INFRA-035: the unit-test step below runs cli/test's runtest rule that
      # validates the readiness checks' kubectl argv against a real kubectl (*), so
      # kubectl has to exist. Pinned to the version the dogfood job installs
      # (internal/tooling/scripts/ci-toolchain.sh), because whether an argv is
      # accepted is a property of a kubectl version — a check is only as strong as
      # the version it ran on.
      #
      # (*) The lifecycle harness cannot cover this. Its fake kubectl accepts any
      # argv, so `kubectl rollout status deployment --all` — a flag kubectl does not
      # have — shipped and made four readiness checks unsatisfiable on every real
      # target, which read as nine unhealthy platform components.
      - name: Install pinned kubectl (readiness-probe argument validation)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/tooling/scripts/ci-toolchain.sh kubectl

      # The unit step's own coverage invariant: every framework package with a
      # unit suite is listed there. Reads ci.yml as YAML and the dune files as
      # stanzas, so reformatting either cannot change the verdict.
      - name: Framework CI coverage
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: python3 internal/ci/check_framework_ci_coverage.py

      - name: Framework CI coverage mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_framework_ci_coverage.sh
      - name: Test reachability guard
        run: python3 internal/ci/check_test_reachability.py

      - name: Test reachability guard mutation coverage
        run: bash internal/ci/test_test_reachability.sh

      - name: Unit tests (no broker/Postgres/Loki required)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        # Every framework package is here. kafka-eio-service's broker-requiring
        # suite is an executable behind the runtest-integration alias, so this
        # step compiles and runs only its unit suite; the alias and sol-jobs'
        # Postgres case run in the integration step below.
        # internal/ci/check_framework_ci_coverage.py holds both facts.
        run: opam exec -- dune test framework/ocaml/kafka-eio-service/ framework/ocaml/sol-env/ framework/ocaml/sol-fn/ framework/ocaml/sol-jobs/ framework/ocaml/sol-obs/ framework/ocaml/sol-outbox/ framework/ocaml/sol-runtime/ framework/ocaml/sol-svc/ framework/ocaml/sol-worker/ cli/test/ internal/tooling/style_audit/ internal/tooling/soldev/test/

      - name: Offline cloud lifecycle (cli/test runtest-lifecycle)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: opam exec -- dune build @cli/test/runtest-lifecycle

      # The other half of the same invariant: a framework suite that needs
      # infrastructure still has to run on the PR gate, not only in
      # run_tests.sh. The two things the framework packages ask for are a
      # Kafka-compatible broker with a schema registry and admin API, and
      # Postgres -- both containers are started the same way the developer loop
      # starts them. Redpanda serves all three endpoints from one container
      # (9092/8081/9644). The broker step is `start-redpanda.sh`, not
      # `ensure-broker.sh`: the latter also creates the demo topics with a host
      # `rpk`, which a clean runner does not have, and these suites register
      # their own topics through the schema registry. sol-jobs' Postgres case
      # skips itself when POSTGRES_URL is unset, which is why the variable is
      # part of this step rather than the suite being excluded from it, and the
      # suites now live behind runtest-integration for that reason.
      # internal/ci/check_framework_ci_coverage.py holds the alias half of this.
      # The database suites are their own targets, `runtest-integration`, not the
      # unit targets with a different ambient environment: they are not built by
      # the unit step, they cannot be served from its cache, and they fail rather
      # than skip when POSTGRES_URL is missing, so this step's exit status is the
      # statement that the Postgres-backed cases ran and passed. One alias per
      # invocation, because both suites destructively own the one sol_jobs table.
      - name: Framework integration tests (broker and database backed)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        timeout-minutes: 20
        env:
          KAFKA_SECURITY_PROTOCOL: plaintext
          KAFKA_BROKERS: localhost:9092
          SCHEMA_REGISTRY_URL: http://localhost:8081
          REDPANDA_ADMIN_URL: http://localhost:9644
          POSTGRES_URL: postgresql://postgres:dev@localhost:5432/sol_dev
        run: |
          bash platform/local/scripts/start-redpanda.sh
          bash platform/local/scripts/ensure-postgres.sh
          opam exec -- dune build @framework/ocaml/kafka-eio-service/test/runtest-integration
          opam exec -- dune build @framework/ocaml/sol-jobs/test/runtest-integration
          opam exec -- dune build @framework/ocaml/sol-outbox/test/runtest-integration

      # VERIF-001: the supported application architecture, end to end and with
      # its failure boundaries — domain state and outbox intent commit in one
      # transaction; the relay publishes an ordered Kafka fact; a worker
      # acknowledges it after idempotently enqueueing an independent effect;
      # sol-jobs retries that effect. The boundaries are exercised
      # deterministically: a forced rollback, a broker outage and recovery, a
      # duplicate delivery, a handler Fail, a transient job failure, a blocked
      # earlier event for one key, and a crash between the broker ack and the
      # row mark. Runs after the step above so it reuses the same broker and
      # Postgres; LOKI_URL is unset, so the Loki assertions self-skip.
      - name: Facts-to-jobs golden-path smoke (broker and database backed)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        timeout-minutes: 15
        env:
          KAFKA_SECURITY_PROTOCOL: plaintext
          KAFKA_BROKERS: localhost:9092
          SCHEMA_REGISTRY_URL: http://localhost:8081
          REDPANDA_ADMIN_URL: http://localhost:9644
          POSTGRES_URL: postgresql://postgres:dev@localhost:5432/sol_dev
        run: opam exec -- dune test internal/fixtures/local-demo/test/ --force

      - name: Install formatter
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: opam install ocamlformat.0.29.0 -y

      - name: Format check
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        # One definition, shared with the pre-commit hook's --staged mode, so the
        # local check and this one cannot drift apart.
        run: internal/ci/check_ocamlformat.sh --all

      - name: ocamlformat guard mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_ocamlformat.sh

      # The harness is part of the qualification system, not a script beside it: it
      # constructs part of the effective configuration handed to Sol/Terraform and it owns
      # teardown. Its defects -- an override that contradicted the var-file, a teardown
      # invoked twice, absence probes that read 'could not look' as 'not there' -- belong
      # here, not an hour into a live run. Unconditional: it stubs every external command
      # and spends nothing.
      - name: Qualification harness state-machine test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/qualification/gcp/test-live-qual.sh

      # The observer owns the harness's structured parts: kubeconfig inspection by structure
      # and the bounded, independently-attempted failure-time capture. Its regression covers
      # the real gcloud kubeconfig shape and the failure modes that lost evidence in 15c-15g
      # (a failed read ending the capture, a hang with no bound, a jsonpath split into words).
      # Unconditional, like the harness test above: it stubs kubectl and spends nothing.
      - name: Qualification observer test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: python3 internal/qualification/gcp/test_observer.py

      - name: Platform-component drift guardrail (ADR 0001 / CODE_LAYER-005)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          python3 internal/ci/check_platform_component_drift.py
          python3 internal/ci/test_platform_component_drift.py

      - name: cert-manager readiness contract (FND-0010)
        # Every GCP attempt failed the platform apply on cert-manager's post-install
        # readiness check, because the Helm provider's default 300s `timeout` bounded a
        # hook cert-manager designed to keep polling. The guard pins the contract that
        # failure violated: the check stays enabled, its per-attempt budget is real, and
        # the release wait is strictly longer than the check's worst case. Its mutation
        # self-test includes the pre-fix configuration, which must be rejected.
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          python3 internal/ci/check_cert_manager_readiness.py .
          python3 internal/ci/test_cert_manager_readiness_check.py

      - name: Kubernetes object ownership (FND-0061)
        # Two Terraform resources in the platform module wrote the same Kubernetes RoleBinding
        # name, so whichever applied second failed with `already exists` and the GCP
        # provisioner's authority could never be created on a fresh target. The guard enforces
        # the invariant behind that -- one Kubernetes object, one Terraform owner -- and its
        # mutation self-test includes the collision that failed the live apply.
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          python3 internal/ci/check_kubernetes_object_ownership.py .
          python3 internal/ci/test_kubernetes_object_ownership_check.py

      - name: Platform storage requirement (INFRA-090)
        # The lifecycle compares a provider's *observed* disk quota against Sol's *declared*
        # minimum before the platform asks for a volume (FND-0062). A declaration that has
        # drifted from the platform it describes would read as a guarantee while being a false
        # floor, so this pins the parts to the module's own declarations.
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          python3 internal/ci/check_platform_storage_requirement.py .
          python3 internal/ci/test_platform_storage_requirement_check.py

      - name: GCP substrate (INFRA-093)
        # FND-0064: the GCP driver provisions GKE Standard. The guard holds the product contract --
        # no Autopilot request, a pool Sol owns, sizing owned by driver defaults rather than the
        # target -- without freezing today's numbers into the definition of GCP support.
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          python3 internal/ci/check_gcp_standard_substrate.py .
          python3 internal/ci/test_gcp_standard_substrate_check.py

      - name: Platform TLS requirement (DEC-056 / FND-0068)
        # Attempt 19 reported the lifecycle Ready while the platform's own certificates were unready,
        # because nothing in the readiness gate covered them. Sol declares those certificates
        # unconditionally, so they are platform resources: the gate now requires exactly the set the
        # module's annotated ingresses declare, and this guard keeps the declaration and the module
        # from drifting apart in either direction.
        if: needs.classify.outputs.kind != 'docs-only'
        run: |
          python3 internal/ci/check_platform_tls_requirement.py .
          python3 internal/ci/test_platform_tls_requirement_check.py

      - name: Node shape fits the platform (FND-0066)
        # Attempt 16 installed on the driver's own defaults -- 3 x e2-standard-2 -- and stopped with
        # four pods the scheduler could not place: a redpanda broker asks 2 CPU and the loki chunk
        # cache 9.6 GiB, against 1.93 CPU / 5.88 GiB allocatable per node. The requirements come from
        # the profile's own capacity envelope, not from this guard, so the drivers cannot default to
        # a shape the profile itself refuses, and a count that cannot carry the envelope after
        # node-failure headroom is refused too.
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          python3 internal/ci/check_node_shape_fits_platform.py .
          python3 internal/ci/test_node_shape_fits_platform_check.py

      - name: Provider TLS path (DEC-055 / FND-0067)
        # Attempt 17 reached Ready with cert-manager's only DNS-01 solver hardcoded to Route 53, so a
        # GCP cluster created certificates it could never issue and the platform reported Ready anyway.
        # The solver and the cert-manager pod's identity are now selected per provider, each provider
        # root supplies its own scope and identity, and each cluster root owns a DNS permission set
        # scoped to the workspace's zone. An empty identity fails closed rather than deploying a solver
        # that runs without credentials.
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          python3 internal/ci/check_provider_tls_path.py .
          python3 internal/ci/test_provider_tls_path_check.py

      - name: Terraform output contract (INFRA-091)
        # FND-0063: the product, the fixture and the lifecycle harness must all hold one idea of
        # what `terraform output -json` publishes. Attempt 13's defect was two artefacts agreeing
        # with each other and with neither Terraform nor reality, so this ties them to one payload
        # Terraform itself produced and forbids the invented shape from returning.
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          python3 internal/ci/check_terraform_output_fixture.py .
          python3 internal/ci/test_terraform_output_fixture_check.py

      - name: gcloud interface and install-authority guard
        # Attempt 2 lost a live run to `gcloud container clusters get-credentials
        # --kubeconfig`, a flag that does not exist: the offline harness could not
        # catch it because its stub was written from the implementation. This checks
        # Sol's argv against gcloud's own help, and that the impersonation grant is
        # scoped to the named provisioner identity and the caller the target declares.
        # It skips -- loudly -- on runners without gcloud, rather than passing.
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/check_gcloud_interface.sh

      - name: Change-classification semantics (internal/ci/classify-changes.sh)
        # The classifier decides whether the expensive suite runs, so it is part
        # of the gate rather than a convenience. Its boundaries are pinned here
        # so a future refactor cannot silently widen the docs-only allowlist --
        # "skip expensive CI" quietly becoming "skip CI for something important"
        # would not be visible in a normal review of the diff.
        run: bash internal/ci/test_classify_changes.sh

      - name: Support-library revisions are declared, never floating (BUG-059)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/check_support_refs.sh

      - name: Support-refs guard mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_support_refs.sh

      - name: Ticket-state transition guard
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_ticket_transitions.sh

      - name: Ticket-move guard (INFRA-066)
        # Deliberately unconditional, with no `classify` condition: a ticket move is
        # itself a docs-only change, and that is exactly the PR shape this checks.
        # The signal is the branch name, which is how a worker already declares which
        # ticket it is on (`fix/infra-048-...`, `INFRA-061/...`); a branch that names a
        # READY ticket must land it, or say "(<ID>, part ...)" if it is one part of a
        # longer ticket. `soldev pipeline submit` already requires DONE/<id>.md for the
        # ticket it is given, but nothing covered a hand-pushed branch.
        run: |
          git fetch --no-tags origin main -q
          # The test job's checkout is shallow by default, which hides the branch's
          # commit subjects -- including the "(<ID>, part A)" declaration this guard
          # reads -- while leaving the branch *name* visible, so a legitimate partial
          # PR would be refused. Deepen before running it.
          git fetch --no-tags --unshallow origin -q 2>/dev/null || git fetch --no-tags origin main -q
          internal/ci/check_ticket_move.sh --base origin/main --branch "${{ github.head_ref }}"

      - name: Ticket-move guard mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_ticket_move.sh

      - name: Pipeline ticket validation guard (BUG-060)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        # Deliberately unconditional, and deliberately not gated on `classify`:
        # filing or editing a ticket *is* a docs-only change, which is exactly the
        # PR shape this covers, and the invariant is about the whole tree. It runs
        # `soldev pipeline validate` -- the same parser `pipeline ls`/`check` read
        # tickets with -- over BACKLOG, READY_FOR_ENGINEERING and DONE, so an
        # unreadable ticket is an error naming the file instead of a ticket that
        # quietly disappears from the queue view. The script is also the guard's
        # mutation test: it plants malformed tickets in a throwaway tree and
        # expects each to be rejected, against a readable control tree that passes.
        run: bash internal/ci/test_pipeline_validate.sh

      - name: Unconditional guards can run (BUG-064)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: python3 internal/ci/check_unconditional_guard_tooling.py .

      - name: Unconditional-guard-tooling mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          bash internal/ci/test_unconditional_guard_tooling.sh
          python3 internal/ci/test_docs_only_path.py

      - name: Workflow paths-filter guard (REFAC-099)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        # Unconditional: a stale `paths:` entry makes its workflow stop triggering
        # silently, and the change that stales it can be any kind of move.
        run: python3 internal/ci/check_workflow_paths.py

      - name: Workflow paths-filter guard mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_workflow_paths.sh

      - name: Examples are self-contained (REFAC-105)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        # Unconditional: an example that reaches into internal/ cannot run from a
        # copy, and the change that introduces it can be a docs-classified YAML edit.
        run: bash internal/ci/check_examples_self_contained.sh

      - name: Examples self-containment mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_examples_self_contained.sh

      - name: Sol's assets are located only by Sol_cli_platform_assets (REFAC-114)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        # Unconditional: a command that finds Sol's source tree itself works only
        # from a checkout, which DEC-049 rules out for an installed release.
        run: bash internal/ci/check_platform_assets_owner.sh

      - name: Platform-assets ownership mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_platform_assets_owner.sh

      - name: Manifests are built as values (REFAC-131)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        # Unconditional: a manifest written as text puts values into it unescaped.
        run: bash internal/ci/check_manifests_are_values.sh

      - name: Manifest-values mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_manifests_are_values.sh

      - name: One process runner, one filesystem helper (REFAC-134)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/check_single_runner.sh

      - name: Single-runner mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_single_runner.sh

      - name: Library code does not print (REFAC-135)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/check_library_output.sh

      - name: Library-output mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_library_output.sh

      - name: No code comments (OCaml, shell, Terraform, TypeScript)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/check_no_comments.sh

      - name: No-comments mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_no_comments.sh

      - name: let* is Result.Syntax, repository-wide (REFAC-137)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/check_result_syntax.sh

      - name: Result.Syntax mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_result_syntax.sh

      - name: JSON is read through Sol_cli_json (REFAC-132)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/check_json_decode_boundary.sh

      - name: JSON-decode-boundary mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_json_decode_boundary.sh
      - name: Runtime failures are returned, not raised (REFAC-133)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/check_no_exception_control_flow.sh

      - name: Exception-control-flow mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: bash internal/ci/test_no_exception_control_flow.sh

      - name: Framework spec signature guard (DOCS-017)
        # Unconditional, and deliberately so: a spec-only change is classified
        # docs-only, and a spec-only change is exactly what drifts.
        run: python3 internal/ci/check_framework_doc_signatures.py

      - name: Framework spec signature guard mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        # Python 3 is what the guard uses to parse declarations; the runner has it.
        run: python3 internal/ci/test_framework_doc_signatures.py

      - name: Worktree/authority preflight (REFAC-090)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        # Cheap and offline, and deliberately unconditional: the semantics it
        # pins -- a declared context is enforced, an undeclared one is advisory,
        # a branch with no upstream and a merge commit are never blocked -- are
        # exactly as important to keep true in a docs-only change.
        run: bash internal/ci/test_authority_check.sh

      - name: Hook install integrity (REFAC-090)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        # A stale hook install is silently inert rather than red, so the only
        # way the repository can notice is a test that runs the installer in a
        # scratch repository and seeds the dangling-symlink failure.
        run: bash internal/ci/test_hook_install.sh

      - name: Scratch-repository identity (VERIF-008)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        # A scratch-repository helper must not operate on whatever repository a
        # Git-invoked caller exported; this pins the refusal and the sanitizer.
        run: bash internal/ci/test_scratch_repo.sh

      - name: Signal-handler duplication guardrail (REFAC-081)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/check_signal_handler_duplication.sh

      - name: Qualification-artifact guardrail (HARDEN-002 run 2)
        # No classification condition: a real account id or a provisioned target
        # reaching the repo is exactly as bad in a docs-only change.
        run: internal/ci/check_no_account_artifacts.sh

      - name: Qualification-artifact guardrail mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/test_no_account_artifacts.sh

      - name: Public cloud lifecycle guardrail (HARDEN-002 finding 5)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/test_public_cloud_lifecycle.sh

      - name: Publisher/deployer identity boundary (ADR 0002)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/test_publisher_deployer_boundary.sh

      # INFRA-035: the guard itself is exercised on every run, because a guard that
      # would not have failed on the bug it exists for is worse than no guard — it
      # buys confidence it has not earned. The guard proper runs as part of the
      # unit-test step above (cli/test's runtest rule), so it only runs where
      # kubectl exists; this proves it rejects the invocation that shipped broken.
      - name: Readiness-probe invocation guard mutation test (INFRA-035)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/test_readiness_invocations_check.sh

      # ADR 0004: normal lifecycle activity must never make a target undeletable.
      # The mutation test runs first because the guard's whole value is that it
      # can fail; the guard then checks this tree.
      # HARDEN-003: an assertion must be demonstrably able to fail. This exercises
      # the vacuous-assertion failure directly.
      - name: Qualification assertion mutation test (HARDEN-003)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/test_qualification_assertions.sh

      # INFRA-040: the substrate's Secret and the migration Job's reference must
      # resolve the same identity, or no workload can be deployed.
      - name: Runtime secret identity guard (INFRA-040)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/check_runtime_secret_identity.sh
      - name: Check GCP provisioner IAM boundary
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/test_gcp_provisioner_role.sh

      - name: Check steady-state cluster-access identity boundary
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/test_cluster_access_identity.sh

      - name: Production infrastructure guard, and its mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          python3 internal/ci/check_production_infra.py .
          python3 internal/ci/test_production_infra_check.py

      - name: Destroy-completeness guard mutation test (INFRA-037)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/test_destroy_completeness_check.sh

      - name: Destroy-completeness guard (INFRA-037)
        # Reads the provider list from the built printer (REFAC-100), so it runs
        # where Build ran; a docs-only change cannot touch a Terraform root.
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: python3 internal/ci/check_destroy_completeness.py .

      - name: Every Terraform-managed resource declares how it is rediscovered (FND-0070)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: python3 internal/ci/check_resource_identity.py .

      - name: Target destruction does not reach project-wide resources (FND-0070)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          python3 internal/ci/check_project_shared_resources.py .
          python3 internal/ci/test_guard_mutations.py

      - name: Destroy releases the workloads before the substrate (FND-0077)
        if: needs.classify.outputs.kind != 'docs-only'
        run: |
          set -eu
          python3 internal/ci/check_workload_release_order.py .
          python3 internal/ci/test_workload_release_order_check.py

      - name: A workload can reach the managed database Sol provisioned (FND-0075)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          python3 internal/ci/check_managed_database_egress.py .
          python3 internal/ci/test_managed_database_egress_check.py

      - name: A deploy establishes a namespace's scoped RBAC before touching it (FND-0072)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          python3 internal/ci/check_deploy_substrate_order.py .
          python3 internal/ci/test_deploy_substrate_order_check.py

      - name: The delegated DNS zone is a durable prerequisite, on every provider (DEC-042/DEC-043)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          python3 internal/ci/check_durable_dns_zone.py .
          python3 internal/ci/test_durable_dns_zone_check.py

      - name: Provider roots mirror by role (DEC-046 rule 4, REFAC-100)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/check_provider_roots.sh .

      - name: Provider roots guard mutation test
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/test_provider_roots.sh

      # REFAC-092: provider dispatch outside approved modules may only shrink, and no
      # wildcard may stand in for a provider (SEC-010 was `Aws -> true | _ -> false`).
      - name: Provider-dispatch guard mutation test (REFAC-092)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/test_provider_dispatch_check.sh

      - name: Provider-dispatch guard (REFAC-092)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/check_provider_dispatch.sh .

      # DOCS-030: docs/reference/cli.md documents every registered command from the binary's
      # own help, so a command added in code cannot land undocumented, and the page cannot
      # carry a command or a flag the binary does not have.
      - name: CLI reference mutation test (DOCS-030)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: python3 internal/ci/test_cli_reference_check.py
      # Two actors can allocate the same ticket id concurrently, and the tree keeps one record
      # per id, so the second would silently replace the first (BUG-110).
      - name: Ticket-overwrite mutation test (BUG-110)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: python3 internal/ci/test_ticket_overwrites.py

      - name: Ticket-overwrite guard (BUG-110)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: python3 internal/ci/check_ticket_overwrites.py --base origin/main

      - name: CLI reference guard (DOCS-030)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: python3 internal/ci/check_cli_reference.py

      # DEC-038: the operator identity owns production observation and diagnosis,
      # and its grant must follow the evidence Sol's read-only commands consume.
      - name: Operator diagnostic grant (DEC-038 / INFRA-057)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: python3 internal/ci/check_operator_diagnostics.py
      - name: Operator diagnostic guard mutation test (INFRA-057)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: python3 internal/ci/test_operator_diagnostics_check.py

      # DEC-039: the qualification transport is harness-only. No production root may
      # reference it, and it may not carry a verb beyond transport and addressing.
      - name: Qualification transport boundary (DEC-039 / INFRA-060)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: python3 internal/ci/check_qualification_transport.py
      - name: Qualification transport guard mutation test (INFRA-060)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/test_qualification_transport_check.sh

      # DEC-040: a captured whoami response must be scrubbable into a fixture without
      # flattening the structure the parser depends on, or leaving an account id behind.
      - name: whoami capture scrubber (DEC-040)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: internal/ci/test_scrub_whoami_capture.sh

      # FEAT-101 / DEC-049: build the real release archive and prove it works
      # installed, where it cannot see this checkout. The runner digest is a
      # fixture: the smoke checks that the binary selects exactly what its bundle
      # names; publishing is the release workflow's.
      - name: Installed-release smoke (FEAT-101)
        if: needs.classify.outputs.kind != 'docs-only' || steps.docs_tooling.outputs.cache-hit != 'true'
        run: |
          cp _build/default/cli/bin/main.exe "$RUNNER_TEMP/sol-dev"
          runner="ghcr.io/example/sol-migration-runner@sha256:$(printf '0%.0s' $(seq 64))"
          archive="$(opam exec -- internal/tooling/scripts/build-release-bundle.sh \
            --version v0.0.0-ci --runner-image "$runner" --out "$RUNNER_TEMP/release" | tail -1)"
          internal/ci/smoke_installed_release.sh "$archive" v0.0.0-ci "$runner" "$RUNNER_TEMP/sol-dev"

      - name: Cache trusted ticket validator
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: _build/default/internal/tooling/soldev/bin/main.exe
          key: soldev-validation-v1-${{ runner.os }}-${{ hashFiles('internal/tooling/soldev/**/*.ml', 'internal/tooling/soldev/**/*.mli', 'internal/tooling/soldev/**/dune', 'internal/tooling/sol_process/**/*.ml', 'internal/tooling/sol_process/**/*.mli', 'internal/tooling/sol_process/**/dune', 'dune-project', 'dune-workspace', '*.opam', 'support-refs.txt') }}

  # FRIC-009: smallest check that would have caught a regression like
  # FRIC-007 (every generated service permanently broken on a fresh
  # substrate) — nothing above exercises the golden path against live
  # infra. Deliberately narrow: no migrate/status/Kafka round-trip, that's
  # periodic /dogfood's job. Separate job (not folded into `test`) so its
  # cluster-bootstrap time doesn't slow the fast unit-test signal.
  #
  # Docker/k3d availability: `ubuntu-22.04` is a GitHub-hosted runner with
  # Docker Engine preinstalled — no availability gate needed today. If
  # `runs-on` ever changes to a self-hosted label, re-check this before
  # assuming Docker is still there.
  #
  # The k3d/helm/kubectl pins live in internal/tooling/scripts/ci-toolchain.sh;
  # DOGFOOD.md's "Kubernetes toolchain" section points at that script for the
  # versions and explains *why* k3d is pinned to this exact version (chart-value
  # compatibility).
  golden-path-smoke:
    # Not a required check, so a job-level condition is safe here: skipping it
    # cannot leave a required status unreported. Consumes the SAME classifier
    # output as `test` rather than carrying its own path list. If `kind` is empty
    # (classify failed) this is TRUE and the job runs -- fail-closed.
    #
    # RULE: a job with this condition must never be added to the required status
    # checks without revisiting the design above.
    needs: classify
    if: always() && needs.classify.outputs.kind != 'docs-only'
    runs-on: ubuntu-22.04
    # Outer safety net only — per-step timeouts below do the real fail-fast
    # work. Generous on purpose: a job-level timeout cancels the whole job,
    # which would also skip the `if: always()` diagnostics step below, so
    # this must never fire under normal operation (worst observed run so
    # far: ~17min).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get install -y librdkafka-dev libpq-dev libpq5

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1

      - name: Cache opam download cache
        # INFRA-008: same shared download cache as the `test` job's step.
        uses: actions/cache@v4
        with:
          path: ~/.opam/download-cache
          key: opam-download-${{ runner.os }}-${{ hashFiles('.github/actions/pin-opam-packages/action.yml', 'support-refs.txt', 'dune-project', 'sol.opam') }}
          restore-keys: |
            opam-download-${{ runner.os }}-

      - name: Pin extracted opam packages
        timeout-minutes: 10
        uses: ./.github/actions/pin-opam-packages

      - name: Install OCaml dependencies
        timeout-minutes: 20
        # --with-test IS needed here despite this job never running `dune
        # test` directly: the generated ci_smoke workspace's `dune build`
        # (inside the smoke-test step below) also compiles test
        # executables under vendor/framework/*/test (symlinked into this
        # monorepo) as part of dune's default alias -- those need alcotest etc. as a
        # BUILD dependency, not just to run. Confirmed by removing this
        # flag and watching golden-path-smoke fail with "Library
        # alcotest not found" on a real CI run.
        #
        # INFRA-008: retry a transient upstream fetch failure before failing
        # the job, and name the unreachable host when the failure is permanent.
        run: |
          set -o pipefail
          log="$(mktemp)"
          for attempt in 1 2 3; do
            if opam install . --deps-only --with-test -y 2>&1 | tee "$log"; then
              exit 0
            fi
            echo "::warning::opam install failed (attempt ${attempt}/3); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          host="$(grep -oE 'Fetch_fail\("[^"]+' "$log" | tail -1 | sed -E 's/.*"//; s|^https?://||; s|/.*||' || true)"
          echo "::error::opam install failed after 3 attempts${host:+ — unreachable host: ${host}}"
          exit 1

      - name: Prepare Sol framework packages (DEC-025)
        timeout-minutes: 20
        # Same canonical bootstrap as the test job: this job scaffolds a real
        # workspace and builds it, so it too must resolve the framework through
        # installed packages rather than a vendored copy.
        run: bash platform/local/scripts/prepare-framework-deps.sh

      - name: Build sol CLI
        timeout-minutes: 5
        run: opam exec -- dune build cli/bin/main.exe

      # The pinned-release downloads live in the shared script, not `curl | bash`:
      # k3d's and helm's own install scripts live on mutable branches, so piping
      # them to a shell would trust unreviewed content. The versions themselves are
      # defined once in internal/tooling/scripts/ci-toolchain.sh.
      - name: Install k3d/kubectl/helm (pinned versions — internal/tooling/scripts/ci-toolchain.sh)
        timeout-minutes: 5
        run: bash internal/tooling/scripts/ci-toolchain.sh

      - name: Golden-path smoke test
        env:
          SOL_FRAMEWORK_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        # Measured across the first 3 real runs on this branch: 11m43s,
        # 8m20s, 10m59s -- a ~40% swing with no code change touching this
        # step's actual work (cluster boot, chart install, health-wait,
        # notably including the exact Redpanda/schema-registry startup
        # FRIC-007 was about). 12min left as little as 17s-1min margin
        # twice out of three runs -- real measured flake risk, not
        # hypothetical. 18min gives comfortable headroom while still
        # failing well inside the 45min job-level net; a genuine
        # crash-loop still gets caught, just not shaved as close.
        timeout-minutes: 18
        run: |
          set -eo pipefail
          export SOL_HOME="$GITHUB_WORKSPACE"
          mkdir -p "$SOL_HOME/.ci-bin"
          ln -sf "$SOL_HOME/_build/default/cli/bin/main.exe" "$SOL_HOME/.ci-bin/sol"
          export PATH="$SOL_HOME/.ci-bin:$PATH"
          hash -r

          sol new workspace ci_smoke
          cd ci_smoke

          # FEAT-041: the workspace scaffold ships exactly one -svc plus one
          # worker, and only -svc gets a ClusterIP Service -- so a real
          # cross-namespace request needs a second service to call. Add a
          # throwaway peer and declare the synchronous dependency on charge_svc
          # (whose sol.toml is the shared template, so appending a [service]
          # section is valid TOML).
          sol new svc checkout/checkout
          printf '\n[service]\ncalls = ["checkout/checkout_svc"]\n' >> app/payments/charge_svc/sol.toml

          # FEAT-079: no -fn app exists anywhere in the scaffold or examples
          # yet, and this is the only place a real cluster is already up --
          # add one here (rather than a whole new example app) to exercise
          # scheduled_concurrency/backoff_limit rendering and `sol fn run`
          # against a real deployed CronJob, in the same sol up pass as
          # everything else so this doesn't need its own health-wait cycle.
          # `sol new fn` appends _fn to the given name itself (the same way
          # `sol new svc checkout/checkout` above produced checkout_svc), so
          # passing "heartbeat" here (not "heartbeat_fn") is what actually
          # lands at app/ops/heartbeat_fn/ -- confirmed by this job's first
          # real run, which instead produced app/ops/heartbeat_fn_fn/.
          sol new fn ops/heartbeat
          # [service] is already open at the top of the generated file (it
          # holds `schedule`); appending a second [service] header at EOF
          # would be a duplicate-table TOML error, so insert into the
          # existing block instead, right after `schedule = ...`.
          sed -i '/^schedule = /a scheduled_concurrency = "forbid"\nbackoff_limit = 5' \
            app/ops/heartbeat_fn/sol.toml

          # The scaffolded workspace pins the framework to sol.git#main, so its
          # images would build this PR's scaffold against main's framework: any
          # PR changing a framework API the scaffold uses (BUG-048's Fn.trigger)
          # could never pass. Build against the commit under test instead.
          internal_ci_pin_ref="${SOL_FRAMEWORK_REF:?}"
          grep -rl 'loganbnielsen/sol.git#main' --include='*.opam' . \
            | xargs -r sed -i "s|loganbnielsen/sol.git#main|loganbnielsen/sol.git#${internal_ci_pin_ref}|g"
          if grep -rq 'loganbnielsen/sol.git#main' --include='*.opam' .; then
            echo "::error::scaffolded workspace still pins sol.git#main"; exit 1
          fi

          eval $(opam env)
          dune build

          sol local infra up

          # BUG-054: ordinary deploy delivers secret references and never
          # writes a value, so seed the workspace secrets first. `sol local
          # secret set` is the only Sol path that writes one, and it creates
          # the namespace it needs.
          sol local secret set POSTGRES_URL \
            --value "postgresql://postgres:dev@postgresql.postgresql.svc.cluster.local:5432/dev"
          sol local secret set SOL_API_KEY --value dev-internal-key

          sol up

          # FEAT-042/BUG-021: `sol local infra up` installs ingress-nginx and forwards
          # the controller to localhost:8088, so the Ingress `sol up` generated
          # for charge_svc must route a request end to end. A service with no
          # declared ingress_host gets a per-service dev host
          # (`<svc>.<ns>.localhost`), so send it as the Host header; derive the
          # namespace from the cluster rather than assuming the
          # workspace->namespace normalization.
          ingress_ns=$(kubectl get ns -o name | sed 's|namespace/||' | grep -- '-payments$' | head -1 || true)
          ingress_host="charge-svc.${ingress_ns}.localhost"
          ingress_ok=0
          for i in $(seq 1 30); do
            if curl -sf -H "Host: ${ingress_host}" "http://localhost:8088/health" >/dev/null; then
              echo "/health via ingress OK (Host: ${ingress_host})"
              ingress_ok=1
              break
            fi
            sleep 2
          done
          if [ "$ingress_ok" -ne 1 ]; then
            echo "::error::FEAT-042: /health never became reachable through the local ingress (Host: ${ingress_host})"
            exit 1
          fi

          # CODE_LAYER-022: verify the framework's runtime endpoints against a
          # real deployed pod, not just the scaffolded /health route. /healthz
          # and /metrics are registered by Sol_svc.Service, so a regression in
          # that layer must fail this job rather than only showing up as a
          # missing Grafana series later.
          # Single source of truth for where probe() writes a response body.
          # /metrics is read back below, so deriving this name in two places is
          # how it came to disagree with what probe() actually wrote: `echo`
          # appends a newline that tr turned into a trailing '_', leaving the
          # body at /tmp/probe_metrics_.out while the check grepped
          # /tmp/probe_metrics.out. printf keeps the derivation exact.
          probe_out_path() {
            printf '/tmp/probe%s.out' "$(printf '%s' "$1" | tr -c '[:alnum:]' '_')"
          }

          probe() {
            local path=$1
            local out
            out=$(probe_out_path "$path")
            local i
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:8080${path}" > "$out"; then
                echo "${path} OK"
                return 0
              fi
              sleep 2
            done
            echo "::error::golden-path smoke test: ${path} never became reachable"
            return 1
          }

          probe /health
          probe /healthz
          probe /metrics
          if ! grep -Eq '# (HELP|TYPE)' "$(probe_out_path /metrics)"; then
            echo "::error::golden-path smoke test: /metrics did not return Prometheus text"
            exit 1
          fi

          # FEAT-041: the declared call's network path is a pair of
          # NetworkPolicies plus an injected peer URL. Assert that the deploy
          # applied all three as rendered -- this covers resolution, rendering
          # and apply end to end.
          #
          # Enforcement is deliberately NOT asserted against the live cluster
          # here: the dev substrate's policy engine (kube-router on k3s v1.27.4)
          # does not match `namespaceSelector` ingress rules for freshly created
          # namespaces and ignores egress policy entirely, so an allow-probe is
          # denied even though the policy is correct per the Kubernetes spec.
          # BUG-022 has the deterministic repro. Rendering is unit-tested in
          # cli/test/test_manifest_render.ml, and customer-cloud CNIs
          # enforce it.
          #
          # Derive namespaces from the cluster rather than assuming the
          # workspace->namespace normalization, so this keeps working if the
          # naming rule changes.
          caller_ns=$(kubectl get ns -o name | sed 's|namespace/||' | grep -- '-payments$' | head -1 || true)
          peer_ns=$(kubectl get ns -o name | sed 's|namespace/||' | grep -- '-checkout$' | head -1 || true)
          if [ -z "$caller_ns" ] || [ -z "$peer_ns" ]; then
            echo "::error::FEAT-041: could not locate caller ('$caller_ns') or peer ('$peer_ns') namespace"
            exit 1
          fi

          caller_env=$(kubectl -n "$caller_ns" get configmap charge-svc-env -o yaml 2>/dev/null || true)
          for needle in "CHECKOUT_SVC_URL" "http://checkout-svc.${peer_ns}.svc.cluster.local"; do
            case "$caller_env" in
              *"$needle"*) ;;
              *) echo "::error::FEAT-041: caller ConfigMap is missing '$needle'"; exit 1 ;;
            esac
          done

          caller_np=$(kubectl -n "$caller_ns" get networkpolicy charge-svc-netpol -o yaml 2>/dev/null || true)
          peer_np=$(kubectl -n "$peer_ns" get networkpolicy checkout-svc-netpol -o yaml 2>/dev/null || true)
          for needle in "$peer_ns" "app: checkout-svc"; do
            case "$caller_np" in
              *"$needle"*) ;;
              *) echo "::error::FEAT-041: caller NetworkPolicy is missing '$needle'"; exit 1 ;;
            esac
          done
          for needle in "$caller_ns" "app: charge-svc" "port: 8080"; do
            case "$peer_np" in
              *"$needle"*) ;;
              *) echo "::error::FEAT-041: peer NetworkPolicy is missing '$needle'"; exit 1 ;;
            esac
          done
          echo "declared service-call wiring (env + NetworkPolicy pair) applied OK"

          # FEAT-067/FEAT-069: a successful deploy must leave a content-addressed
          # release record — listed by `sol releases`, carried verbatim as the
          # workload's `release` label, pointed at by the current-release object,
          # and not editable in place.
          sol local releases > "$GITHUB_WORKSPACE/releases.txt"
          grep -F 'ID' "$GITHUB_WORKSPACE/releases.txt" >/dev/null
          if [ "$(wc -l < "$GITHUB_WORKSPACE/releases.txt")" -lt 2 ]; then
            echo "::error::FEAT-067: sol up recorded no release"
            exit 1
          fi
          listed_ids=$(awk 'NR>1 {print $1}' "$GITHUB_WORKSPACE/releases.txt" | tr '\n' ' ')

          # FEAT-069: the taxonomy label a workload carries must be one of the
          # ids `sol releases` lists — that equality is the join key from a
          # deploy record to its telemetry.
          label_release=$(kubectl -n "$caller_ns" get deployment charge-svc -o jsonpath='{.spec.template.metadata.labels.release}' 2>/dev/null || true)
          case "$label_release" in
            r-????????????????) ;;
            *) echo "::error::FEAT-069: workload release label '$label_release' is not a content-addressed release id"; exit 1 ;;
          esac
          case " ${listed_ids} " in
            *" ${label_release} "*) ;;
            *) echo "::error::FEAT-069: workload release label '$label_release' is not among the ids sol releases lists (${listed_ids})"; exit 1 ;;
          esac

          release_cm=$(kubectl -n default get configmap -l sol.dev/type=release -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ "$release_cm" != "sol-release-${label_release}" ]; then
            echo "::error::FEAT-069: release ConfigMap '$release_cm' is not named for release '$label_release'"
            exit 1
          fi
          pointer=$(kubectl -n default get configmap -l sol.dev/type=release-current,sol.dev/workspace=ci_smoke -o jsonpath='{.items[0].data.release_id}' 2>/dev/null || true)
          if [ "$pointer" != "$label_release" ]; then
            echo "::error::FEAT-069: current-release pointer '$pointer' != workload release '$label_release'"
            exit 1
          fi
          if kubectl -n default patch configmap "$release_cm" -p '{"data":{"tampered":"1"}}' >/dev/null 2>&1; then
            echo "::error::FEAT-067: release ConfigMap was edited in place (immutable: true not honoured)"
            exit 1
          fi
          echo "release record written, listed, labelled and immutable OK"

          # FEAT-070: the same deploy is also a deployment event — an immutable
          # sol-deployment-<id> record whose release_id is the release above, and
          # whose deployment_id is the id `sol deployments` lists. The event is
          # the deploy invocation; the release is what it put in place.
          sol local deployments > "$GITHUB_WORKSPACE/deployments.txt"
          grep -F 'DEPLOYMENT' "$GITHUB_WORKSPACE/deployments.txt" >/dev/null
          if [ "$(wc -l < "$GITHUB_WORKSPACE/deployments.txt")" -lt 2 ]; then
            echo "::error::FEAT-070: sol up recorded no deployment event"
            exit 1
          fi
          listed_deployment=$(awk 'NR==2 {print $1}' "$GITHUB_WORKSPACE/deployments.txt")
          listed_deployment_release=$(awk 'NR==2 {print $2}' "$GITHUB_WORKSPACE/deployments.txt")
          case "$listed_deployment" in
            d-*) ;;
            *) echo "::error::FEAT-070: sol deployments listed '$listed_deployment', not a deployment id"; exit 1 ;;
          esac
          if [ "$listed_deployment_release" != "$label_release" ]; then
            echo "::error::FEAT-070: deployment event points at '$listed_deployment_release', workload release is '$label_release'"
            exit 1
          fi
          # FEAT-071: a successful apply records outcome=applied.
          listed_status=$(awk 'NR==2 {print $5}' "$GITHUB_WORKSPACE/deployments.txt")
          if [ "$listed_status" != "applied" ]; then
            echo "::error::FEAT-071: successful sol up recorded status '$listed_status', expected applied"
            exit 1
          fi
          # The record's release link is its sol.dev/release label (the JSON body
          # carries it too); `sol deployments` must have listed the record that
          # claims this release, named by its deployment id.
          deployment_cm=$(kubectl -n default get configmap -l "sol.dev/type=deployment,sol.dev/release=${label_release}" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ "$deployment_cm" != "sol-deployment-${listed_deployment}" ]; then
            echo "::error::FEAT-070: deployment record for release '$label_release' is '$deployment_cm', sol deployments listed 'sol-deployment-${listed_deployment}'"
            exit 1
          fi
          if kubectl -n default patch configmap "sol-deployment-${listed_deployment}" -p '{"data":{"tampered":"1"}}' >/dev/null 2>&1; then
            echo "::error::FEAT-070: deployment ConfigMap was edited in place (immutable: true not honoured)"
            exit 1
          fi
          echo "deployment event written, listed, joined to its release and immutable OK"

          # FEAT-079: scheduled_concurrency/backoff_limit render into the
          # deployed CronJob, and `sol fn run` creates a real ad-hoc Job from
          # it. Both are fast kubectl reads/creates -- no health-wait loop
          # needed, unlike the HTTP-serving workloads above.
          fn_ns=$(kubectl get ns -o name | sed 's|namespace/||' | grep -- '-ops$' | head -1 || true)
          if [ -z "$fn_ns" ]; then
            echo "::error::FEAT-079: could not locate the heartbeat_fn namespace"
            exit 1
          fi
          fn_cronjob=$(kubectl -n "$fn_ns" get cronjob -o name | sed 's|cronjob.batch/||' | head -1 || true)
          if [ -z "$fn_cronjob" ]; then
            echo "::error::FEAT-079: no CronJob found in namespace $fn_ns"
            exit 1
          fi
          fn_spec=$(kubectl -n "$fn_ns" get cronjob "$fn_cronjob" -o yaml)
          case "$fn_spec" in
            *"concurrencyPolicy: Forbid"*) ;;
            *) echo "::error::FEAT-079: CronJob $fn_cronjob is missing concurrencyPolicy: Forbid"; exit 1 ;;
          esac
          case "$fn_spec" in
            *"backoffLimit: 5"*) ;;
            *) echo "::error::FEAT-079: CronJob $fn_cronjob is missing backoffLimit: 5"; exit 1 ;;
          esac
          echo "scheduled_concurrency/backoff_limit rendered into the deployed CronJob OK"

          jobs_before=$(kubectl -n "$fn_ns" get jobs -o name | wc -l)
          sol local fn run "ops/heartbeat_fn"
          jobs_after=$(kubectl -n "$fn_ns" get jobs -o name | wc -l)
          if [ "$jobs_after" -le "$jobs_before" ]; then
            echo "::error::FEAT-079: 'sol local fn run' did not create a new Job in $fn_ns"
            exit 1
          fi
          manual_job=$(kubectl -n "$fn_ns" get jobs -o name | sed 's|job.batch/||' | grep -- '-manual-' | head -1 || true)
          if [ -z "$manual_job" ]; then
            echo "::error::FEAT-079: no manually-created Job found in $fn_ns"
            exit 1
          fi
          # `kubectl create job --from=cronjob/X` sets an ownerReference back
          # to the source CronJob (confirmed by this job's own run) -- the
          # positive check that actually matters is that the reference names
          # the *right* CronJob, proving `sol fn run` really did copy from
          # the deployed one rather than some other source.
          job_owner_kind=$(kubectl -n "$fn_ns" get job "$manual_job" -o jsonpath='{.metadata.ownerReferences[0].kind}')
          job_owner_name=$(kubectl -n "$fn_ns" get job "$manual_job" -o jsonpath='{.metadata.ownerReferences[0].name}')
          if [ "$job_owner_kind" != "CronJob" ] || [ "$job_owner_name" != "$fn_cronjob" ]; then
            echo "::error::FEAT-079: manual Job $manual_job's owner is '$job_owner_kind/$job_owner_name', expected 'CronJob/$fn_cronjob'"
            exit 1
          fi
          echo "'sol fn run' created Job $manual_job from the deployed CronJob $fn_cronjob OK"

      # `sol up` blocks on an un-timed-out `kubectl rollout status`
      # internally, so a crash-looping pod (this job's whole reason to
      # exist — see FRIC-007) makes the step above hang until GitHub
      # Actions kills it at its own timeout-minutes, bypassing any
      # in-step diagnostic logic entirely. `if: always()` so this step
      # still runs after that kind of external kill, not just after a
      # clean nonzero exit — named for what it does, not when: per-pod
      # describe/logs only fire for pods this loop finds unhealthy, so a
      # green run still stays cheap (one cluster/pod/event summary).
      - name: Dump cluster diagnostics
        if: always()
        run: |
          echo "=== k3d clusters ==="
          k3d cluster list || true
          echo "=== all pods ==="
          kubectl get pods -A -o wide || true
          echo "=== recent events ==="
          kubectl get events -A --sort-by=.lastTimestamp || true
          for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            for pod in $(kubectl get pods -n "$ns" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              # || true on both: a pod can be deleted/replaced between the
              # outer list above and these per-pod queries -- entirely
              # realistic during actual pod churn (a crash-looping pod
              # restarting), i.e. exactly the scenario this step exists to
              # diagnose. Without || true, set -e would kill this whole
              # loop on that race, possibly before ever reaching the pod
              # that's actually broken.
              phase=$(kubectl get pod "$pod" -n "$ns" -o jsonpath='{.status.phase}' 2>/dev/null) || true
              # Pod-level Ready condition, not containerStatuses[0] -- a
              # multi-container pod's first container isn't reliably the
              # workload container (e.g. redpanda-0 here is
              # [config-watcher, redpanda]; index 0 being ready says
              # nothing about whether redpanda itself is). The Ready
              # condition is True only when every container is ready.
              ready=$(kubectl get pod "$pod" -n "$ns" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null) || true
              if [ "$phase" != "Running" ] || [ "$ready" != "True" ]; then
                echo "=== describe $ns/$pod ==="
                kubectl describe pod "$pod" -n "$ns" || true
                echo "=== logs $ns/$pod (current) ==="
                kubectl logs "$pod" -n "$ns" --all-containers || true
                echo "=== logs $ns/$pod (previous, if crash-looped) ==="
                kubectl logs "$pod" -n "$ns" --all-containers --previous || true
              fi
            done
          done

  dockerfile-matrix:
    # Not a required check. Consumes the SAME classifier output as `test` so it
    # fails closed on an empty `kind`; the two smoke jobs consume its output, so
    # adding a Dockerfile under examples/ or internal/fixtures/ makes it build
    # without a second hand-maintained list.
    needs: classify
    if: always() && needs.classify.outputs.kind != 'docs-only'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      examples: ${{ steps.derive.outputs.examples }}
      demo_ts: ${{ steps.derive.outputs.demo_ts }}
    steps:
      - uses: actions/checkout@v5

      - name: Derive the Dockerfile matrices
        id: derive
        run: |
          examples="$(python3 internal/tooling/scripts/dockerfile_matrix.py examples)"
          demo_ts="$(python3 internal/tooling/scripts/dockerfile_matrix.py demo-ts)"
          echo "examples=$examples" >> "$GITHUB_OUTPUT"
          echo "demo_ts=$demo_ts" >> "$GITHUB_OUTPUT"

  # FRIC-014: nothing else catches the checked-in example workspaces
  # (examples/pluto, internal/fixtures/venus) drifting out of sync with what `sol
  # new`'s scaffold template (tpl_dockerfile in
  # cli/lib/base/sol_cli_scaffold_templates.ml) actually generates.
  # DOGFOOD-011 found a real, live instance: a stale base image tag and a
  # missing `opam install` step, invisible locally only because a stale
  # Docker layer cache papered over it. --no-cache is deliberate for the
  # same reason -- a cached layer is exactly what let this go unnoticed.
  #
  # Scoped to the OCaml example Dockerfiles only: those are the ones a Sol
  # scaffold template actually generates. examples/pluto/app/demo_ts/ (the
  # FEAT-033 TypeScript spike) is hand-maintained with no Sol template to
  # drift from, so it's out of scope here.
  #
  # Build context is each workspace's OWN root (the directory holding sol.yml),
  # which is exactly what `sol up` and the README use. These examples are now
  # ordinary Sol workspaces: DEC-025 removed the coupling where `sol new`
  # symlinked framework source into the generated workspace, so each has its own
  # dune-project and .opam and resolves the framework through INSTALLED opam
  # packages. The context is deliberately no longer this repository, so the job
  # fails if a workspace ever starts needing the enclosing repository again.
  #
  example-dockerfile-smoke:
    # Not a required check, so a job-level condition is safe here: skipping it
    # cannot leave a required status unreported. Consumes the SAME classifier
    # output as `test` rather than carrying its own path list. If `kind` is empty
    # (classify failed) this is TRUE and the job runs -- fail-closed.
    #
    # RULE: a job with this condition must never be added to the required status
    # checks without revisiting the design above.
    needs: [classify, dockerfile-matrix]
    if: always() && needs.classify.outputs.kind != 'docs-only' && needs.dockerfile-matrix.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.dockerfile-matrix.outputs.examples) }}
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.dockerfile }}
        env:
          SOL_FRAMEWORK_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        # Same reason as golden-path-smoke: the example's *.opam pins sol.git#main;
        # build it against the commit under test, not main's framework.
        run: |
          grep -rl 'loganbnielsen/sol.git#main' --include='*.opam' ${{ matrix.context }} \
            | xargs -r sed -i "s|loganbnielsen/sol.git#main|loganbnielsen/sol.git#${SOL_FRAMEWORK_REF:?}|g"
          docker build --no-cache -f ${{ matrix.dockerfile }} ${{ matrix.context }}

  # FEAT-039/FEAT-085: example-dockerfile-smoke above deliberately excludes
  # examples/pluto/app/demo_ts/ (hand-maintained, no Sol template to drift
  # from). Its two Dockerfiles still need an ongoing build check, and since
  # FEAT-085 they build from the *Sol workspace root* (examples/pluto, the
  # directory holding sol.yml) rather than from the Sol repository root: the
  # demo_ts TypeScript project (app/demo_ts) resolves @sol-fab/obs and
  # @sol-fab/kafka from npm, so the workspace is self-contained. This job builds
  # them exactly the way the README tells a user to, which is what makes it
  # meaningful -- it fails if the workspace ever starts needing the enclosing
  # repository again.
  demo-ts-dockerfile-smoke:
    # Not a required check, so a job-level condition is safe here: skipping it
    # cannot leave a required status unreported. Consumes the SAME classifier
    # output as `test` rather than carrying its own path list. If `kind` is empty
    # (classify failed) this is TRUE and the job runs -- fail-closed.
    #
    # RULE: a job with this condition must never be added to the required status
    # checks without revisiting the design above.
    needs: [classify, dockerfile-matrix]
    if: always() && needs.classify.outputs.kind != 'docs-only' && needs.dockerfile-matrix.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.dockerfile-matrix.outputs.demo_ts) }}
    steps:
      - uses: actions/checkout@v5

      - name: Build app/demo_ts/${{ matrix.service }}/Dockerfile
        working-directory: examples/pluto
        run: docker build --no-cache -f app/demo_ts/${{ matrix.service }}/Dockerfile .

  # DEC-022: OCaml and TypeScript are both first-class application languages, so
  # a first-class language's demo must build in CI.
  #
  # FEAT-085: this job consumes @sol-fab/* the way an external developer's
  # workspace would -- from npm, with examples/pluto/app/demo_ts as the npm
  # project root and no Sol repository npm workspace involved.
  #
  # The @sol-fab/obs and @sol-fab/kafka *suites* are deliberately no longer run
  # here. Their authoritative CI is the standalone repositories
  # (loganbnielsen/sol-obs, loganbnielsen/sol-kafka), which is also where the
  # real-Redpanda retry/DLQ tests live -- Redpanda has therefore left this job
  # entirely. The Sol repo verifies *consumption* of the published packages, not
  # their internals; re-running those suites from here blurred ownership.
  ts-tests:
    # Not a required check, so a job-level condition is safe here: skipping it
    # cannot leave a required status unreported. Consumes the SAME classifier
    # output as `test` rather than carrying its own path list. If `kind` is empty
    # (classify failed) this is TRUE and the job runs -- fail-closed.
    #
    # RULE: a job with this condition must never be added to the required status
    # checks without revisiting the design above.
    needs: classify
    if: always() && needs.classify.outputs.kind != 'docs-only'
    name: TypeScript demo (install + build/typecheck)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # There is no Sol-repository npm project any more; the lockfile that
          # matters is the demo's own.
          cache-dependency-path: examples/pluto/app/demo_ts/package-lock.json

      - name: Install (demo_ts project root only)
        working-directory: examples/pluto/app/demo_ts
        run: npm ci

      - name: Build and typecheck both services
        working-directory: examples/pluto/app/demo_ts
        run: npm run build -w order-svc -w fulfillment-worker

      - name: Dependency advisories (AUDIT-068)
        # Production dependencies only, and only high or above: this is the bar
        # AUDIT-068 was filed against (11 OpenTelemetry advisories, 2 of them
        # high), and it is deliberately not an all-severity gate -- a
        # moderate-only advisory in a devDependency should not block an
        # unrelated change. Drift past this line fails visibly rather than
        # waiting for the next audit to notice.
        working-directory: examples/pluto/app/demo_ts
        run: npm audit --omit=dev --audit-level=high

  # FEAT-087: `golden-path-smoke` (OCaml) is the only job that proves a real
  # deploy works end to end -- `ts-tests`/`demo-ts-dockerfile-smoke` above stop
  # at typecheck and `docker build`. TypeScript is a first-class Sol
  # application language (DEC-022), so it gets the same platform-contract
  # proof: deploy `demo_ts` to a real cluster, confirm it's Ready, confirm
  # `/healthz`, and run one real transaction through Kafka into Postgres.
  #
  # Deliberately narrow -- this is NOT a reproduction of FEAT-082's lifecycle
  # experiments (SIGTERM-mid-flight ordering, retry/DLQ exhaustion). Those
  # already have a recorded evidence trail; this job answers a different,
  # narrower question: can a real TypeScript Sol application go from
  # published-package dependency through the platform and actually work.
  #
  # Version boundary (see FEAT-087): this job never touches the
  # `loganbnielsen/sol-typescript` repository. It resolves `@sol-fab/svc`/
  # `@sol-fab/worker` from the public npm registry, at whatever version
  # `examples/pluto/app/demo_ts/package-lock.json` pins -- exactly what an
  # external developer's `npm ci` would do. Bumping that pin is an ordinary
  # PR in this repo (see FEAT-086), the same way `golden-path-smoke` bumps its
  # opam-pinned `*-eio` versions rather than building them from sibling
  # source checkouts.
  #
  # Not a required check yet (matches `golden-path-smoke`'s own bring-up
  # precedent) -- get it stable first, then decide separately whether it
  # should gate merges.
  golden-path-smoke-ts:
    needs: classify
    if: always() && needs.classify.outputs.kind != 'docs-only'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get install -y librdkafka-dev libpq-dev libpq5

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.1

      - name: Cache opam download cache
        uses: actions/cache@v4
        with:
          path: ~/.opam/download-cache
          key: opam-download-${{ runner.os }}-${{ hashFiles('.github/actions/pin-opam-packages/action.yml', 'support-refs.txt', 'dune-project', 'sol.opam') }}
          restore-keys: |
            opam-download-${{ runner.os }}-

      - name: Pin extracted opam packages
        timeout-minutes: 10
        uses: ./.github/actions/pin-opam-packages

      - name: Install OCaml dependencies
        timeout-minutes: 20
        # Same retry/host-naming pattern as `test`/`golden-path-smoke` --
        # INFRA-008.
        run: |
          set -o pipefail
          log="$(mktemp)"
          for attempt in 1 2 3; do
            if opam install . --deps-only --with-test -y 2>&1 | tee "$log"; then
              exit 0
            fi
            echo "::warning::opam install failed (attempt ${attempt}/3); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          host="$(grep -oE 'Fetch_fail\("[^"]+' "$log" | tail -1 | sed -E 's/.*"//; s|^https?://||; s|/.*||' || true)"
          echo "::error::opam install failed after 3 attempts${host:+ — unreachable host: ${host}}"
          exit 1

      - name: Prepare Sol framework packages (DEC-025)
        timeout-minutes: 20
        run: bash platform/local/scripts/prepare-framework-deps.sh

      - name: Build sol CLI
        timeout-minutes: 5
        run: opam exec -- dune build cli/bin/main.exe

      - name: Install k3d/kubectl/helm (pinned versions — internal/tooling/scripts/ci-toolchain.sh)
        timeout-minutes: 5
        run: bash internal/tooling/scripts/ci-toolchain.sh

      - name: TypeScript golden-path smoke test
        timeout-minutes: 18
        run: |
          set -eo pipefail
          export SOL_HOME="$GITHUB_WORKSPACE"
          mkdir -p "$SOL_HOME/.ci-bin"
          ln -sf "$SOL_HOME/_build/default/cli/bin/main.exe" "$SOL_HOME/.ci-bin/sol"
          export PATH="$SOL_HOME/.ci-bin:$PATH"
          hash -r

          cd examples/pluto

          sol local infra up

          # BUG-054: seed the demo_ts namespace's secrets before the deploy;
          # ordinary deploy verifies them and never writes a value.
          sol local secret set POSTGRES_URL --domain demo_ts \
            --value "postgresql://postgres:dev@postgresql.postgresql.svc.cluster.local:5432/dev"
          sol local secret set SOL_API_KEY --domain demo_ts --value dev-internal-key

          sol up --scope=demo_ts

          demo_ns=$(kubectl get ns -o name | sed 's|namespace/||' | grep -- '-demo-ts$' | head -1)

          # fulfillment_worker subscribes with `fromBeginning: false`
          # (app code, out of scope to change here). For a genuinely new
          # consumer group -- exactly what a fresh cluster's first-ever
          # deploy creates -- that means "start from the tail": a message
          # produced before the group finishes joining is not delayed, it
          # is invisible to it forever. This job's first real run hit
          # exactly this: POST /orders succeeded at a timestamp 8.8s
          # *before* the worker's own log showed "[ConsumerGroup] Consumer
          # has joined the group", so the message landed in a topic no
          # consumer had subscribed to yet, and no retry budget on the
          # Postgres check downstream could ever have found it.
          #
          # A Kubernetes-level `kubectl wait --for=condition=ready` cannot
          # establish this (verified experimentally, see git history on
          # this file): the worker Deployment has no readiness probe, so
          # that condition means "container started," nothing more. The
          # only real signal is the application's own evidence that it
          # joined -- so wait on that directly, the same "poll for the
          # actual observed effect" pattern `probe()` below uses for HTTP.
          # The wait itself must not be fragile. This step runs under
          # `set -o pipefail`, and `kubectl logs ... | grep -q PATTERN`
          # reports *no match* whenever PATTERN appears early in a stream
          # larger than the pipe buffer: `grep -q` exits at the first match,
          # kubectl keeps writing into a now-closed pipe, and pipefail
          # propagates kubectl's SIGPIPE exit (141) out of the whole
          # pipeline -- so the success case reads as a miss. Reproduced
          # locally: a 2,000,000-line producer with the pattern on line 2
          # returned NOMATCH. Capture the logs first, then match with a
          # herestring, so no pipeline is involved and no exit status can
          # come from anything but grep.
          wait_for_consumer_join() {
            local i logs
            for i in $(seq 1 30); do
              logs=$(kubectl logs -n "$demo_ns" -l app=fulfillment-worker --all-containers 2>/dev/null || true)
              if grep -Fq '"message":"[ConsumerGroup] Consumer has joined the group","groupId":"sol-demo-ts-fulfillment-worker"' <<< "$logs"; then
                echo "fulfillment-worker consumer group joined OK"
                return 0
              fi
              sleep 2
            done
            echo "::error::TS golden-path smoke test: fulfillment-worker's consumer group never reported joining within the timeout"
            return 1
          }
          wait_for_consumer_join

          probe() {
            local path=$1
            local i
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:8080${path}" > /dev/null; then
                echo "${path} OK"
                return 0
              fi
              sleep 2
            done
            echo "::error::TS golden-path smoke test: ${path} never became reachable"
            return 1
          }

          probe /healthz

          # One real transaction through the whole path: HTTP -> order_svc ->
          # Kafka -> fulfillment_worker -> Postgres. Marker is unique per run
          # so a re-run (or a flaky retry) can't misread a stale row from a
          # previous attempt as this run's evidence. The request also carries a
          # traceparent we chose, so the trace id is known in advance and can be
          # asserted end to end below (BUG-070).
          marker="ci-ts-golden-$(date +%s)-${RANDOM}"
          trace_id=$(openssl rand -hex 16)
          span_id=$(openssl rand -hex 8)
          http_code=$(curl -s -o /tmp/order_response.json -w '%{http_code}' \
            -X POST http://localhost:8080/orders \
            -H 'Content-Type: application/json' \
            -H "traceparent: 00-${trace_id}-${span_id}-01" \
            -d "{\"order_id\":\"${marker}\",\"item\":\"widget\",\"quantity\":1}")
          if [ "$http_code" != "202" ]; then
            echo "::error::TS golden-path smoke test: POST /orders returned $http_code, expected 202 ($(cat /tmp/order_response.json))"
            exit 1
          fi
          echo "POST /orders OK (202, marker=${marker}, trace=${trace_id})"

          # fulfilled_orders_ts is created by fulfillment_worker itself
          # (CREATE TABLE IF NOT EXISTS in db.ts) -- no Sol migration owns
          # this table, so there is nothing to `sol migrate` here.
          #
          # POSTGRES_URL comes from fulfillment_worker's own injected Secret
          # (the exact credential the app itself uses), not the Postgres
          # Helm chart's internal secret path -- decoupled from that chart's
          # own implementation, which this job has no reason to know about.
          pg_url=$(kubectl get secret -n "$demo_ns" fulfillment-worker-secrets -o jsonpath='{.data.POSTGRES_URL}' | base64 -d)
          pg_pod=$(kubectl get pods -n postgresql -l app.kubernetes.io/name=postgresql -o jsonpath='{.items[0].metadata.name}')
          row_found=0
          # With the consumer-join wait above having closed the cold-start
          # window, what remains is genuine in-flight latency (publish ->
          # broker -> handler -> Postgres), so this stays an eventual
          # assertion with an outer deadline rather than a fixed sleep.
          # It is also the assertion that actually matters: the contract
          # under test is "an accepted order is eventually fulfilled", not
          # "Kafka group membership became ready". 90*2s=3min is a generous
          # but bounded ceiling so CI cannot hang forever, not an assumption
          # about how long startup should take.
          for i in $(seq 1 90); do
            row=$(kubectl exec -n postgresql "$pg_pod" -- psql "$pg_url" -tAc \
              "SELECT order_id FROM fulfilled_orders_ts WHERE order_id = '${marker}';" 2>/dev/null || true)
            if [ "$row" = "$marker" ]; then
              row_found=1
              break
            fi
            sleep 2
          done
          if [ "$row_found" -ne 1 ]; then
            echo "::error::TS golden-path smoke test: order ${marker} never reached fulfilled_orders_ts (Kafka -> worker -> Postgres path did not complete)"
            exit 1
          fi
          echo "Postgres row for ${marker} confirmed OK -- HTTP -> Kafka -> worker -> Postgres path proven"

          # Caller-to-worker trace continuity (BUG-070): the traceparent sent
          # with that request must survive order_svc and the Kafka header, so
          # the trace holds a span from each unit rather than two rooted traces.
          # Asserted against Tempo's query API (the same store the demo's README
          # tells a user to read), so an app that starts a fresh root trace --
          # the pre-fix behaviour -- fails here.
          trace_ok=0
          for i in $(seq 1 30); do
            trace=$(curl -sf "http://localhost:3200/api/traces/${trace_id}" 2>/dev/null || true)
            services=$(jq -r '[.batches[].resource.attributes[]? | select(.key == "service.name") | .value.stringValue] | unique | .[]' <<< "$trace" 2>/dev/null || true)
            if grep -Fxq 'order-svc-ts' <<< "$services" && grep -Fxq 'fulfillment-worker-ts' <<< "$services"; then
              trace_ok=1
              break
            fi
            sleep 2
          done
          if [ "$trace_ok" -ne 1 ]; then
            echo "::error::TS golden-path smoke test: trace ${trace_id} did not span both order-svc-ts and fulfillment-worker-ts -- inbound trace context was not preserved"
            curl -s "http://localhost:3200/api/traces/${trace_id}" | head -c 500 || true
            exit 1
          fi
          echo "trace ${trace_id} spans order-svc-ts and fulfillment-worker-ts -- inbound trace context preserved"

          # Coarse liveness check, not a reproduction of FEAT-082's
          # forced-shutdown/redelivery experiments: a graceful pod delete
          # must produce a clean replacement, not a CrashLoopBackOff.
          order_pod=$(kubectl get pods -n "$demo_ns" -l app=order-svc -o jsonpath='{.items[0].metadata.name}')
          kubectl delete pod -n "$demo_ns" "$order_pod" --grace-period=30 --wait=false
          replacement_ok=0
          for i in $(seq 1 30); do
            new_pod=$(kubectl get pods -n "$demo_ns" -l app=order-svc -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            phase=$(kubectl get pod "$new_pod" -n "$demo_ns" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            restarts=$(kubectl get pod "$new_pod" -n "$demo_ns" -o jsonpath='{.status.containerStatuses[0].restartCount}' 2>/dev/null || true)
            if [ -n "$new_pod" ] && [ "$new_pod" != "$order_pod" ] && [ "$phase" = "Running" ] && [ "$restarts" = "0" ]; then
              replacement_ok=1
              break
            fi
            sleep 2
          done
          if [ "$replacement_ok" -ne 1 ]; then
            echo "::error::TS golden-path smoke test: order-svc replacement pod did not come up cleanly after a graceful delete"
            exit 1
          fi
          echo "graceful pod delete OK -- clean replacement, 0 restarts"

      # Same rationale as golden-path-smoke's own diagnostics step: `sol up`
      # blocks on an un-timed-out rollout wait, so a crash-looping pod hangs
      # this job until GitHub Actions kills it at the job timeout, bypassing
      # in-step error handling. `if: always()` catches that case too.
      - name: Dump cluster diagnostics
        if: always()
        run: |
          echo "=== k3d clusters ==="
          k3d cluster list || true
          echo "=== all pods ==="
          kubectl get pods -A -o wide || true
          echo "=== recent events ==="
          kubectl get events -A --sort-by=.lastTimestamp || true

          # Always dump demo_ts's own app logs, unconditionally -- a plain
          # worker Deployment has no readiness probe, so Kubernetes reports
          # it Ready (and the loop below would skip it) well before its
          # Kafka consumer has actually joined a group. The first real run
          # of this job needed exactly this evidence and didn't have it.
          demo_ns_diag=$(kubectl get ns -o name 2>/dev/null | sed 's|namespace/||' | grep -- '-demo-ts$' | head -1 || true)
          if [ -n "$demo_ns_diag" ]; then
            for app in order-svc fulfillment-worker; do
              echo "=== logs $demo_ns_diag/$app (app=$app, current) ==="
              kubectl logs -n "$demo_ns_diag" -l "app=$app" --all-containers --tail=200 || true
            done
          fi

          for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            for pod in $(kubectl get pods -n "$ns" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              phase=$(kubectl get pod "$pod" -n "$ns" -o jsonpath='{.status.phase}' 2>/dev/null) || true
              ready=$(kubectl get pod "$pod" -n "$ns" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null) || true
              if [ "$phase" != "Running" ] || [ "$ready" != "True" ]; then
                echo "=== describe $ns/$pod ==="
                kubectl describe pod "$pod" -n "$ns" || true
                echo "=== logs $ns/$pod (current) ==="
                kubectl logs "$pod" -n "$ns" --all-containers || true
                echo "=== logs $ns/$pod (previous, if crash-looped) ==="
                kubectl logs "$pod" -n "$ns" --all-containers --previous || true
              fi
            done
          done
