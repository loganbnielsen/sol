name: Pin opam packages
description: >
  Pin every extracted -eio/https-eio support package listed in packages.txt,
  at the commit given in `refs` or at #main otherwise, retrying each
  pin a bounded number of times so a brief upstream tarball-host outage
  (INFRA-008) does not fail a pull request that changes no dependencies.
  Single source of truth for both CI jobs that need a full build (test and
  golden-path-smoke) so the pin list and its ordering constraint never drift
  out of sync between them.
inputs:
  refs:
    description: >
      Newline-separated "<package> <commit>" lines resolved once for the whole
      workflow run (devtools/ci/ci-evidence.sh resolve), so every job builds
      against the same support-package commits. A package without a line is
      pinned at #main.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REFS: ${{ inputs.refs }}
      run: |
        # Explicit even though Actions sets it: the retry below depends on the
        # pipeline's status coming from opam, not from the trailing `tee`.
        set -o pipefail

        # Tracking #main on every support package during active parallel
        # development across all of them — sol should build against their
        # latest code, not a tag that's fallen behind. Revert to tagged
        # pins once these settle and cut real releases. packages.txt holds
        # the list and its required order.
        #
        # INFRA-008: a pin installs immediately, so it can fetch a transitive
        # source from a non-GitHub host (observed: mtime from erratique.ch).
        # Opam's own --retry did not ride out a brief outage there, so retry
        # the pin ourselves; on final failure, quote the unreachable host so
        # the diagnosis does not require reading the whole job log.
        retry_pin() {
          local pkg="$1" url="$2" attempt=1 delay=5 log host
          log="$(mktemp)"
          while true; do
            if opam pin add "$pkg" "$url" -y 2>&1 | tee "$log"; then
              rm -f "$log"
              return 0
            fi
            if [ "$attempt" -ge 3 ]; then
              host="$(grep -oE 'Fetch_fail\("[^"]+' "$log" | tail -1 | sed -E 's/.*"//; s|^https?://||; s|/.*||' || true)"
              echo "::error::opam pin ${pkg} failed after 3 attempts${host:+ — unreachable host: ${host}}"
              rm -f "$log"
              return 1
            fi
            echo "::warning::opam pin ${pkg} failed (attempt ${attempt}/3); retrying in ${delay}s"
            attempt=$((attempt + 1))
            sleep "$delay"
            delay=$((delay * 2))
          done
        }

        # fd 3, so nothing inside the loop can consume the list from stdin.
        while read -r -u 3 pkg url; do
          case "$pkg" in ''|'#'*) continue ;; esac
          ref="$(printf '%s\n' "$REFS" | awk -v p="$pkg" '$1 == p { print $2; exit }')"
          retry_pin "$pkg" "${url}#${ref:-main}"
        done 3< "${{ github.action_path }}/packages.txt"
