name: Pin opam packages
description: >
  Pin every extracted -eio/https-eio support package at the commit the
  repository's support-refs.txt declares (BUG-059). The checkout is the source
  of truth: there is no resolved snapshot to pass in and no fallback to a branch.
  Shared by every job that needs a full build.
runs:
  using: composite
  steps:
    - shell: bash
      run: bash internal/ci/pin-support-packages.sh support-refs.txt
